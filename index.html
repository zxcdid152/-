<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>명세똑똑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&family=Jua&display=swap">
<style>
/* Layout: 상단 5단계 스테퍼 + 단계별 본문. 검토 단계는 좌측 급여표, 우측 원본 대조 패널. */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#15202e; --muted:#586577; --line:#d8dee6; --line2:#e8ecf1;
  --accent:#1d4e89; --accent-ink:#ffffff; --accent-soft:#e3edf9;
  --err:#b42318; --err-bg:#fde8e6; --warn:#9a6700; --warn-bg:#fdf0cf; --info:#1f6f8b; --info-bg:#e1f1f6; --ok:#2a7a4b; --ok-bg:#e0f3e8;
  --y:#e8fb68;--m:#78f7a0;--b:#92abf8;--o:#f4ab6c;--l:#cdb1f7;--k:#111418;
  --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#161d27; --ink:#e5ebf3; --muted:#98a4b5; --line:#2a3441; --line2:#222c38;
  --accent:#7db0ee; --accent-ink:#0b1420; --accent-soft:#1b2a3d;
  --err:#ff9187; --err-bg:#3a1c1a; --warn:#f2bd5a; --warn-bg:#392c10; --info:#7ccbe3; --info-bg:#14303a; --ok:#6fd09a; --ok-bg:#15301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#161d27; --ink:#e5ebf3; --muted:#98a4b5; --line:#2a3441; --line2:#222c38;
  --accent:#7db0ee; --accent-ink:#0b1420; --accent-soft:#1b2a3d;
  --err:#ff9187; --err-bg:#3a1c1a; --warn:#f2bd5a; --warn-bg:#392c10; --info:#7ccbe3; --info-bg:#14303a; --ok:#6fd09a; --ok-bg:#15301f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 4px;text-wrap:balance}
h3{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:500;letter-spacing:.04em}
p{margin:0}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.stepper{display:flex;gap:4px;flex-wrap:wrap;padding:0;margin:0;list-style:none}
.stepper button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.stepper button b{font-family:var(--mono);font-weight:500;margin-right:6px}
.stepper button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper button.done{color:var(--ink)}
.stepper button:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.sample{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px;cursor:pointer;font:inherit;color:inherit;min-width:0}
.sample:hover{border-color:var(--accent)}
.sample .tag{font-family:var(--mono);font-size:12px;color:var(--accent)}
.sample ul{margin:0;padding-left:16px;color:var(--muted);font-size:12.5px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--muted);margin-top:12px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.notice{border-left:3px solid var(--warn);background:var(--warn-bg);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13px;margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],select{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 8px;min-width:0;max-width:100%}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
/* analysis */
.phases{list-style:none;margin:12px 0;padding:0;display:grid;gap:6px}
.phases li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.phases li i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:inline-grid;place-items:center;font-style:normal;font-size:11px}
.phases li.on{color:var(--ink)} .phases li.on i{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:500}
.stat.trend{grid-column:span 2}.stat.trend b{font-family:inherit;font-size:17px;font-weight:600;line-height:1.5;padding-top:2px}.stat.trend:hover{border-color:var(--accent)}
.stat span{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 10px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--surface);position:sticky;top:0}
td.n,th.n{text-align:right}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:500}
.pill.err{background:var(--err-bg);color:var(--err)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.info{background:var(--info-bg);color:var(--info)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
.bar{display:inline-block;width:56px;height:6px;background:var(--line2);border-radius:3px;vertical-align:middle;margin-right:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)} .bar.low i{background:var(--warn)}
/* review */
.rev{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media(max-width:980px){.rev{grid-template-columns:minmax(0,1fr)!important}}
.summary{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pay th.g-earn{border-bottom:2px solid var(--accent)} .pay th.g-ded{border-bottom:2px solid var(--muted)} .pay th.g-tot{border-bottom:2px solid var(--ink)}
.pay td.cell{cursor:pointer;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.pay td.cell:hover{background:var(--accent-soft)}
.pay td.zero{color:var(--muted);opacity:.55}
.pay td.err{background:var(--err-bg);color:var(--err);box-shadow:inset 0 0 0 1px var(--err)}
.pay td.warn{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.pay td.info{background:var(--info-bg);color:var(--info)}
.pay td.sel{outline:2px solid var(--accent);outline-offset:-2px}
.pay td.edited::after{content:"●";color:var(--accent);font-size:8px;margin-left:4px;vertical-align:super}
.pay td.sum{font-weight:500;background:color-mix(in srgb,var(--line2) 55%,transparent)}
.pay tr.hasiss td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.side{position:sticky;top:12px;display:grid;gap:12px;max-height:calc(100vh - 24px);overflow:auto}
@media(max-width:980px){.side{position:static;max-height:none}}
.issues{display:grid;gap:4px;max-height:220px;overflow:auto}
.iss{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 8px;cursor:pointer;font:inherit;font-size:12.5px;width:100%}
.iss.cur{border-color:var(--accent);background:var(--accent-soft)}
.srcgrid td{border:1px solid var(--line2);font-family:var(--mono);font-size:11.5px;padding:3px 6px;max-width:92px;overflow:hidden;text-overflow:ellipsis}
.srcgrid td.hit{background:var(--warn-bg);outline:2px solid var(--warn);outline-offset:-2px;font-weight:700}
.kv{display:grid;grid-template-columns:78px minmax(0,1fr);gap:4px 8px;font-size:13px;margin:6px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.legend{margin:4px 0 10px;font-size:13px}.legend summary{cursor:pointer;color:var(--info);font-weight:500}.legend-t td{padding:3px 8px;border-bottom:1px solid var(--line2);font-size:12.5px}.legend-t .warnc{color:var(--warn)}
.bookbar{border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin-bottom:12px;display:block}.bookbar label,.bookbar button{margin-left:6px}
table.jobs tr.job{cursor:pointer}.btn.rm{color:var(--err)}.modal{position:fixed;inset:0;background:rgba(10,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modal[hidden]{display:none}.mbox{background:var(--surface);color:var(--ink);border-radius:10px;max-width:420px;width:100%;padding:20px 22px;box-shadow:0 10px 30px rgba(0,0,0,.25);border-top:4px solid var(--err)}.mwarn{color:var(--err);font-weight:700;font-size:13px}.mbox h3{margin:6px 0 8px;font-size:17px;color:var(--ink);font-weight:700}.mbox p{margin:0 0 8px;font-size:13.5px;overflow-wrap:anywhere}.mbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.btn.danger{background:var(--err);color:#fff;border-color:var(--err)}.jobmsg{margin-top:8px;font-size:13px;background:var(--info-bg);border-radius:6px;padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}table.jobs tr.curjob td{background:var(--info-bg)}table.jobs tr.job:hover td{background:var(--line2)}table.jobs td{vertical-align:top}table.jobs td:last-child{white-space:nowrap}table.jobs td:nth-child(2){max-width:260px;overflow-wrap:anywhere}table.jobs th.n,table.jobs td.n{text-align:right}
.joblist{font-weight:600}
.rev{grid-template-columns:minmax(0,1fr) 400px}.side{min-width:0}.side>.card{min-width:0;max-width:100%;overflow-x:hidden}.side .scroll{max-width:100%;overflow-x:auto}.iss .pill{white-space:nowrap}.iss span:last-child{min-width:0;overflow-wrap:anywhere}
.guide{overflow-wrap:anywhere;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:13px;background:var(--surface)}.guide .gh{margin-bottom:6px}.guide dl{margin:0}.guide dt{font-weight:600;font-size:12px;color:var(--muted,#667);margin-top:6px}.guide dd{margin:2px 0 0}.guide ul,.guide ol{margin:2px 0 0 18px;padding:0}.guide li{margin:2px 0}.guide .ask{margin-top:8px}.guide .ask textarea{width:100%;font:inherit;font-size:12.5px;margin:4px 0}.guide .resolve{margin-top:10px;border-top:1px dashed var(--line2);padding-top:8px}.logrow{border-bottom:1px solid var(--line2);padding:6px 0}
.hist table.htab{width:100%;border-collapse:collapse;font-size:12.5px}.hist .htab th,.hist .htab td{padding:5px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}.hist .htab .n{text-align:right}.hist summary{cursor:pointer}.office summary{cursor:pointer}.samples{text-align:center;margin-top:8px;font-size:13px}.samples summary{cursor:pointer;color:var(--muted,#667);list-style:none}.samples summary::-webkit-details-marker{display:none}.samples summary::after{content:' ▾'}.who{display:inline-flex;gap:6px;align-items:center;margin-left:auto}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
/* payslip */
.ps{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:820px){.ps{grid-template-columns:minmax(0,1fr)}}
.emplist{display:grid;gap:2px;max-height:520px;overflow:auto}
.emplist label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.emplist label.cur{background:var(--accent-soft)}
.paper{background:#fff;color:#14202e;border:1px solid #c9d1db;border-radius:4px;padding:28px 30px;max-width:640px;margin:0 auto;font-size:13px}
.paper h2{text-align:center;font-size:19px;letter-spacing:.2em;margin:0 0 14px;color:#14202e}
.paper .meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;border-top:2px solid #14202e;border-bottom:1px solid #c9d1db;padding:8px 0;margin-bottom:10px;font-size:12.5px}
.paper .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.paper .cols h4{margin:0 0 4px;font-size:12px;background:#eef2f7;padding:3px 8px}
.paper .row{display:flex;justify-content:space-between;gap:8px;padding:3px 8px;border-bottom:1px dotted #d5dbe3}
.paper .row span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.paper .tot{font-weight:700;background:#f6f8fb;border-bottom:1px solid #14202e}
.paper .net{display:flex;justify-content:space-between;margin-top:12px;border:2px solid #14202e;padding:9px 12px;font-weight:700;font-size:15px}
.paper .net span:last-child{font-family:var(--mono)}
.paper .note{margin-top:12px;font-size:11.5px;color:#586577}
.paper .need{color:#b42318;font-weight:700}.paper .calc{display:block;font-size:11px;color:#586577;font-family:inherit}.paper .work{margin-top:10px;font-size:12px;color:#14202e}
.legal{border:1px solid var(--line,#d0d7e2);border-radius:12px;padding:12px 14px;margin-bottom:14px}.legal .lhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.legal .lgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.legal h4{margin:0 0 6px;font-size:13px}.legal .lrow{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:5px 0;border-top:1px dotted var(--line,#d0d7e2);font-size:13px}
.legal .btn.on{outline:2px solid var(--o,#f59e0b)}@media(max-width:820px){.legal .lgrid{grid-template-columns:1fr}.legal .lrow{grid-template-columns:1fr}}
@media(max-width:520px){.paper{padding:18px 14px}.paper .cols{grid-template-columns:1fr}}
.log{font-family:var(--mono);font-size:12px;max-height:180px;overflow:auto;border:1px solid var(--line2);border-radius:6px;padding:8px;background:var(--bg)}
/* landing */
.hero{padding:34px 0 26px;display:grid;gap:18px;max-width:760px}
.hero .eyebrow{font-size:13px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.hero .eyebrow i{width:10px;height:10px;border-radius:50%;background:var(--m);display:inline-block;box-shadow:0 0 0 2px var(--k)}
.hero h2{font-size:clamp(34px,6.2vw,58px);line-height:1.12;letter-spacing:-.035em;font-weight:700;margin:0}
.hero p.lead{font-size:clamp(15px,2vw,18px);color:var(--muted);max-width:560px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.pillbtn{border:1.5px solid var(--k);background:var(--k);color:#fff;border-radius:999px;padding:12px 22px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.pillbtn.out{background:transparent;color:var(--ink);border-color:var(--ink)}
.pillbtn.sm{padding:8px 16px;font-size:13px}
.pillbtn:hover{transform:translateY(-1px)}
:root[data-theme="dark"] .pillbtn:not(.out){background:#fff;color:#111;border-color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pillbtn:not(.out){background:#fff;color:#111;border-color:#fff}}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 26px}
.flow div{border-radius:20px;padding:14px 16px;color:#111418;min-width:0}
.flow b{display:block;font-size:12px;font-family:var(--mono);font-weight:500;opacity:.7}
.flow span{display:block;font-weight:700;font-size:16px;margin-top:2px}
.flow small{display:block;font-size:12.5px;opacity:.78;margin-top:4px;line-height:1.4}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.pc{border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:10px;color:#111418;min-width:0;border:0;text-align:left;font:inherit;cursor:pointer}
.pc .mini{background:#fff;border-radius:16px;padding:12px;min-height:104px;box-shadow:0 1px 0 rgba(0,0,0,.06);overflow:hidden}
.pc .mini table{font-size:11px;width:100%}
.pc .mini th,.pc .mini td{padding:3px 6px;border-bottom:1px solid #e6e9ee;background:transparent;position:static;color:#222;font-size:11px;font-weight:500}
.pc .mini th{color:#7a8594}
.pc .eyebrow{font-size:13px;opacity:.75}
.pc h3{font-size:25px;line-height:1.2;letter-spacing:-.02em;margin:0;color:#111418;font-weight:700}
.pc p{font-size:14.5px;line-height:1.55}
.pc ul{margin:0;padding-left:18px;font-size:13px;opacity:.85}
.pc .go{margin-top:auto;align-self:flex-start;border:1.5px solid #111418;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;background:transparent;color:#111418}
.pc:hover .go{background:#111418;color:#fff}
.wide{border-radius:28px;padding:26px;margin-top:16px;color:#111418;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:center}
@media(max-width:760px){.wide{grid-template-columns:1fr}}
.wide h3{font-size:25px;letter-spacing:-.02em;margin:4px 0 8px;color:#111418}
.wide .drop{margin:0;background:rgba(255,255,255,.55);border:1.5px dashed #111418;color:#111418;border-radius:20px}
.wide .drop.over{background:#fff}
.wide input[type=text]{background:#fff;color:#111418;border-color:#111418;border-radius:999px;padding:8px 14px}
.note2{margin-top:16px;border-radius:20px;background:var(--o);color:#111418;padding:12px 18px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
/* home */
.homebg{width:min(380px,80vw);height:auto;margin-top:8px;pointer-events:none;user-select:none}
.home{min-height:68vh;display:grid;grid-template-columns:min(640px,100%);justify-content:center;align-content:center;justify-items:center;gap:26px;text-align:center}
.wm{color:#111418;position:relative;z-index:1;font-family:'Jua','Noto Sans KR',sans-serif;font-size:clamp(48px,11vw,92px);letter-spacing:.02em;font-weight:400;margin:0}
.drop.big{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:999px;padding:12px 14px 12px 28px;margin:0;background:var(--surface);color:var(--muted);font-size:15px}
.drop.big.over{border-color:var(--ink);background:var(--accent-soft)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fixbox{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px;margin:8px 0}
.fixopts{display:grid;gap:8px}
.fixopt{display:grid;gap:3px;font-size:12px;line-height:1.45}
.fixopt .fixbtn{justify-self:start;text-align:left;white-space:normal;background:var(--surface);color:var(--ink);border-color:var(--accent)}
.infotodo{font-size:12.5px;line-height:1.5;margin:0 0 8px;padding:6px 8px;border-left:3px solid var(--info,#2f6fb0);background:var(--surface)}
.fixor{font-size:12px;border-top:1px dashed var(--line);padding-top:6px}
.fixdirect{gap:6px}
.fixdirect select,.fixdirect input{font-size:12.5px}
.grp-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;margin:4px 0 6px}
.grp2{border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}

function guideHTML(i,idx){const g=guideOf(i),pre=RESOLVE_PRESET[i.type]||['원본 확인함'];

  <ol class="todo">${g.todo.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
  <dl class="tip"><dt>무슨 오류</dt><dd>${esc(g.what)}</dd>
  ${g.causes.length?`<dt>가능한 원인</dt><dd><ul>${g.causes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></dd>`:''}
  ${g.impact?`<dt>그대로 두면</dt><dd>${esc(g.impact)}</dd>`:''}</dl>
  
  <div class="resolve"><div class="chips">${pre.map(p=>`<button class="chip" data-act="preset" data-i="${idx}" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>
  <div style="display:flex;gap:6px;margin-top:6px"><input type="text" data-note="${idx}" placeholder="처리 메모 (무엇을 확인했는지)" style="flex:1"><button class="btn sm pri" data-act="resolve" data-key="${esc(i.key)}" data-i="${idx}">메모 남기고 처리</button></div></div></div>`}
function logHTML(){const done=S.issues.filter(i=>S.resolved[i.key]);if(!done.length)return '';
  return `<details class="card" style="margin-top:12px"><summary><b>처리 기록 ${done.length}건</b></summary><div style="display:grid;gap:6px;margin-top:8px">${done.map(i=>{const r=S.resolved[i.key];
   return `<div class="logrow"><span class="pill ${i.level}">${ISSUE_TYPE[i.type]||i.type}</span> ${esc(i.msg)}<div class="muted" style="font-size:12px">메모: ${esc(r.note||'(메모 없음)')} · ${esc(r.at||'')}</div><button class="btn sm" data-act="unresolve" data-key="${esc(i.key)}">되돌리기</button></div>`}).join('')}</div></details>`}

function selPos(s){
  if(!s)return null;
  if(s.t==='col')return rawPos(S.hr,s.c);
  const e=S.emps.find(x=>x.r===s.r);if(!e)return null;
  if(s.t==='item'){const it=e.items[s.code];return it&&it.cols.length?rawPos(s.r,it.cols[0]):rawPos(s.r,S.roles.name)}
  if(s.t==='sum'){const code={G:'EARN_GROSS',D:'DED_TOTAL',N:'NET_PAY'}[s.w];const x=e.src[code];return rawPos(s.r,x?x.col:S.roles.name)}
  return rawPos(s.r,S.roles.name);
}

function readFx(wb){const fx={};wb.SheetNames.forEach(n=>{const ws=wb.Sheets[n],o={};let k=0;for(const a in ws){if(a[0]!=='!'&&ws[a]&&ws[a].f){o[a]=ws[a].f;k++}}if(k)fx[n]=o});return fx}

const PDF_SRC='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',PDF_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function loadPdfJs(){if(window.pdfjsLib)return window.pdfjsLib;
  await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=PDF_SRC;sc.onload=ok;sc.onerror=()=>no(new Error('PDF 읽기 도구를 불러오지 못했습니다(인터넷 연결 확인)'));document.head.appendChild(sc)});
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDF_WORKER;return window.pdfjsLib}
async function readBook(f){const ext=((f.name||'').split('.').pop()||'').toLowerCase(),buf=await f.arrayBuffer();
  if(ext==='pdf')return await readPdf(buf);
  if(ext==='csv'||ext==='txt'||ext==='tsv'){const u=new Uint8Array(buf);let txt,enc;
    try{txt=new TextDecoder('utf-8',{fatal:true}).decode(u);enc='UTF-8'}catch(_){txt=new TextDecoder('euc-kr').decode(u);enc='한글 완성형(CP949)'}
    txt=txt.replace(/^\uFEFF/,'');const wb=XLSX.read(txt,{type:'string',raw:true});
    const sheets={};wb.SheetNames.forEach((n,i)=>{sheets[i?n:'CSV']=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})});
    return {sheets,fx:{},src:{kind:'csv',enc}}}
  const wb=XLSX.read(buf,{type:'array'});const sheets={};wb.SheetNames.forEach(n=>{sheets[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})});
  return {sheets,fx:readFx(wb),src:{kind:'xlsx'}}}
async function readPdf(buf){const lib=await loadPdfJs();const doc=await lib.getDocument({data:new Uint8Array(buf),cMapUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',cMapPacked:true,standardFontDataUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/'}).promise;const sheets={};let n=0;
  for(let p=1;p<=doc.numPages;p++){const pg=await doc.getPage(p),tc=await pg.getTextContent(),items=[];
    tc.items.forEach(i=>{if(!i.str||!i.str.trim())return;const x=i.transform[4],y=i.transform[5],h=Math.abs(i.transform[3])||i.height||8,w=i.width||i.str.length*h*.5,cw=w/Math.max(1,i.str.length);
      i.str.replace(/\S+(?: \S+)*/g,(t,off)=>{items.push({s:t,x:x+off*cw,w:t.length*cw,y,h});return t})});
    n+=items.length;if(items.length)sheets[`PDF ${p}쪽`]=pdfGrid(items)}
  if(!n)throw new Error('글자가 없는 PDF(스캔 이미지)입니다. 엑셀·CSV나 글자를 고를 수 있는 PDF를 받아 주세요.');
  return {sheets,fx:{},src:{kind:'pdf',pages:doc.numPages}}}
/* PDF 글자 위치 → 표: 같은 높이 글자를 한 줄로, 숫자가 3개 이상인 줄의 글자 폭으로 칸을 나누고, 그 바로 위 붙은 줄들을 헤더 한 줄로 합친다 */
function pdfGrid(items){const lines=[];items.sort((a,b)=>b.y-a.y||a.x-b.x);
  for(const it of items){const L=lines.find(l=>Math.abs(l.y-it.y)<=Math.max(2,it.h*.45));if(L)L.items.push(it);else lines.push({y:it.y,h:it.h,items:[it]})}
  lines.sort((a,b)=>b.y-a.y);lines.forEach(l=>l.items.sort((a,b)=>a.x-b.x));
  const isN=t=>/\d|^-$/.test(t)&&parseNum(t)!==null,dl=lines.filter(l=>l.items.filter(i=>isN(i.s)).length>=3);
  if(!dl.length)return lines.map(l=>[l.items.map(i=>i.s).join(' ')]);
  const fi=lines.indexOf(dl[0]);let hs=fi-1;while(hs-1>=0&&lines[hs-1].y-lines[hs].y<=Math.max(lines[hs].h,lines[hs-1].h)*1.9&&!lines[hs-1].items.some(i=>isN(i.s)))hs--;
  let sp=[];dl.forEach(l=>l.items.forEach(i=>sp.push([i.x,i.x+i.w])));sp.sort((a,b)=>a[0]-b[0]);
  const cols=[];sp.forEach(([a,b])=>{const c=cols[cols.length-1];if(c&&a<=c[1]+1)c[1]=Math.max(c[1],b);else cols.push([a,b])});
  const colOf=i=>{let best=-1,bo=0;cols.forEach((c,k)=>{const o=Math.min(c[1],i.x+i.w)-Math.max(c[0],i.x);if(o>bo){bo=o;best=k}});
    if(best<0){const m=i.x+i.w/2;let d=1e9;cols.forEach((c,k)=>{const dd=Math.min(Math.abs(c[0]-m),Math.abs(c[1]-m));if(dd<d){d=dd;best=k}})}return best};
  const rowOf=ls=>{const row=Array(cols.length).fill('');ls.forEach(l=>l.items.forEach(i=>{const k=colOf(i);row[k]=row[k]?row[k]+(ls.length>1?'':' ')+i.s:i.s}));return row};
  const out=[];lines.forEach((l,k)=>{if(hs>=0&&k>hs&&k<fi)return;if(k===hs&&hs>=0){out.push(rowOf(lines.slice(hs,fi)));return}
    if(k<hs){out.push(l.items.map(i=>i.s));return}out.push(rowOf([l]))});
  return out}

const PH=['파일 읽기 · 시트 선택','구조 감지 (방향 · 헤더 · 구역)','항목 매핑 (사전 + 문맥 규칙)','금액 추출 (셀에서 직접 읽기)','합계 · 정합성 검증'];

/* ============ [v3] 여러 급여대장 한 번에 (작업 목록) ============ */
let JOBS=[];

async function loadFiles(files,append){
  const prev=append?S:null;
  if(!append){JOBS=[];S=fresh();S.step=1;S.loading=files.length;render()}
  MULTI=true;const start=JOBS.length;await loadRules();
  for(const f of files){
    if(append&&JOBS.some(j=>j.file===f.name&&j.fsize===f.size)){continue} /* 같은 파일 중복 추가 방지 */
    S=fresh();S.file=f.name;S.fsize=f.size;
    try{const bk=await readBook(f);S.sheets=bk.sheets;S.fx=bk.fx;S.src=bk.src;if(analyze()){build();checkWork()}}
    catch(err){S.error='파일을 읽지 못했습니다: '+err.message}
    S.analyzed=true;S.phase=PH.length;S.step=1;JOBS.push(S);
  }
  crossCheck();autoPair();await attachStoredPrev(JOBS);
  if(append){S=JOBS[start]||prev;S.step=1;S.jobMsg=`${JOBS.length-start}개 파일을 추가했습니다${files.length>JOBS.length-start?` (이미 있는 파일 ${files.length-(JOBS.length-start)}개는 건너뜀)`:''}`;render();return}
  const ok=JOBS.map((j,i)=>({i,o:jobInfo(j).ord})).filter(x=>x.o<9).sort((a,b)=>a.o-b.o||a.i-b.i),first=ok[0]||{i:0};S=JOBS[first?first.i:0];render();
}
/* [v11] 같은 사업장·같은 달 파일끼리 금액 대조(예: 엑셀과 PDF) */
function crossCheck(){const cur=S,key=j=>(j.company||'')+'|'+(j.payMonth||''),g={};
  JOBS.forEach(j=>{j.cross=[];if(j.error||!(j.emps||[]).length||!j.company||!j.payMonth)return;(g[key(j)]=g[key(j)]||[]).push(j)});
  const amt=it=>it?(it.orig!=null?it.orig:it.amount):0;
  Object.values(g).filter(a=>a.length>1).forEach(a=>{for(let i=0;i<a.length;i++)for(let k=i+1;k<a.length;k++){const A=a[i],B=a[k];if(A.file===B.file)continue;
    A.emps.forEach(ea=>{const eb=B.emps.find(x=>x.name===ea.name);if(!eb)return;new Set([...Object.keys(ea.items),...Object.keys(eb.items)]).forEach(c=>{const va=amt(ea.items[c]),vb=amt(eb.items[c]);
      if(Math.abs(va-vb)>0.5){A.cross.push({r:ea.r,code:c,name:ea.name,me:va,other:vb,file:B.file});B.cross.push({r:eb.r,code:c,name:eb.name,me:vb,other:va,file:A.file})}})})}});
  JOBS.forEach(j=>{if(j.cross.length||j.hadCross){S=j;S.issues=makeIssues();j.hadCross=!!j.cross.length}});S=cur}
/* [v5] 잘못 넣은 파일 제거 · 되돌리기 — 제거 전 확인 팝업(페이지 안 모달, 시간 제한 없음) */

function removeJob(i){

  RMARM=null;closeModal();const wasCur=JOBS[i]===S;JOBS.splice(i,1);REMOVED={job:j,at:i};

function undoRemove(){if(!REMOVED)return;JOBS.splice(Math.min(REMOVED.at,JOBS.length),0,REMOVED.job);S=REMOVED.job;S.step=1;MULTI=true;S.jobMsg=`“${REMOVED.job.file}”을(를) 되돌렸습니다.`;REMOVED=null;render()}
function jobInfo(j){
  const act=j.issues?j.issues.filter(i=>!j.resolved[i.key]):[],c={error:0,warn:0,info:0};act.forEach(i=>c[i.level]++);
  const sent=Object.values(j.send||{}).filter(x=>x.s==='완료').length,sel=(j.emps||[]).filter(e=>j.checked[e.r]).length;
  let st,cls,ord;
  if(j.error){st='열지 못함';cls='err';ord=9}
  else if(!j.emps.length){st='직원 없음';cls='err';ord=9}
  else if(sel&&sent>=sel){st='발송 완료';cls='ok';ord=4}
  else if(c.error){st='오류 확인 필요';cls='err';ord=1}
  else if(c.warn){st='주의 확인 필요';cls='warn';ord=2}

async function saveSample(k,btn){
  const sp=SAMPLES.find(x=>x.key===k),d=sp.build(),o=btn.textContent;
  try{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(d.aoa),d.Sheet);
    const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
    await DL.save({filename:sp.file,data:new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})});btn.textContent='저장 요청 완료'}
  catch(e){btn.textContent=e&&e.code==='declined'?'저장을 취소했습니다':'저장할 수 없습니다'}
  setTimeout(()=>{btn.textContent=o},2500);
}
function stats(){
  const mc=S.cols.filter(c=>!c.role&&!isExcl(c)&&S.emps.some(e=>{const row=S.grid[e.r]||[];return parseNum(row[c.c])!==null}));
  const auto=mc.filter(c=>effCode(c)&&effConf(c)>=.8).length;
  return {cols:mc.length,auto,pct:mc.length?Math.round(auto/mc.length*100):0,mapped:mc.filter(c=>effCode(c)).length};

/* ============ [v2] 연락처 주소록 (자버 직원연락처 + 직접 입력 기억) ============ */
/* 브라우저 localStorage에 저장(이 브라우저에서만 유지). 가상 데이터 전용. */
const BOOK_KEY='payslip_book_v1';
let BOOK=[];
try{BOOK=JSON.parse(localStorage.getItem(BOOK_KEY)||'[]')||[]}catch(_){BOOK=[]}
function saveBook(){try{localStorage.setItem(BOOK_KEY,JSON.stringify(BOOK))}catch(_){}}
const nName=s=>String(s??'').replace(/\s+/g,'').toLowerCase();
const nBiz=s=>String(s??'').replace(/\(주\)|㈜|주식회사|[\s()（）·.\-_]/g,'').toLowerCase();
function nBirth(v){ /* 다양한 표기 → YYMMDD */
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return String(d.getUTCFullYear()).slice(2)+String(d.getUTCMonth()+1).padStart(2,'0')+String(d.getUTCDate()).padStart(2,'0')}
  const t=String(v??'').trim(); if(!t)return '';
  let m=t.match(/^(\d{4})[.\-/]\s*(\d{1,2})[.\-/]\s*(\d{1,2})/); if(m)return m[1].slice(2)+m[2].padStart(2,'0')+m[3].padStart(2,'0');
  m=t.match(/^(\d{2})[.\-/](\d{1,2})[.\-/](\d{1,2})/); if(m)return m[1]+m[2].padStart(2,'0')+m[3].padStart(2,'0');
  m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(m)return m[3].slice(2)+m[1].padStart(2,'0')+m[2].padStart(2,'0');
  m=t.match(/^(\d{6})$/); if(m)return m[1];
  m=t.match(/^(\d{8})$/); if(m)return m[1].slice(2);
  return '';
}
function nPhone(v){const d=String(v??'').replace(/\D/g,'');if(d.length===11)return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);if(d.length===10)return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);return String(v??'').trim()}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>1)return 9;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
/* 자버 직원연락처 엑셀 → 주소록 */
async function loadBookFile(f){
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    let added=0,updated=0,seen=0,bizN=0;
    for(const sn of wb.SheetNames){
      const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
      bizN+=readBizSheet(a,f.name+' · '+sn);const hr=a.findIndex(r=>r.some(v=>['직원명','성명','이름'].includes(norm(v))));if(hr<0)continue;
      const H=a[hr].map(norm),ix=k=>H.findIndex(h=>k.includes(h));
      const iN=ix(['직원명','성명','이름']),iB=ix(['사업장명','상호','회사명']),iC=ix(['사업장코드']),iD=ix(['생년월일']),iP=ix(['휴대전화','휴대폰','연락처','전화']),iE=ix(['이메일','email']),iK=ix(['알림톡수신동의','알림톡동의','알림톡']),iM=ix(['회원번호']);
      for(let r=hr+1;r<a.length;r++){const row=a[r];const name=String(row[iN]??'').trim();if(!name)continue;seen++;
        const rec={biz:iB>=0?String(row[iB]??'').trim():'',bizCode:iC>=0?String(row[iC]??''):'',name,birth:iD>=0?nBirth(row[iD]):'',
          phone:iP>=0?nPhone(row[iP]):'',email:iE>=0?String(row[iE]??'').trim():'',kakao:iK>=0?String(row[iK]??'').trim().toUpperCase()==='Y':null,
          id:iM>=0?String(row[iM]??''):'',src:`${f.name} · ${sn}!${XLSX.utils.encode_cell({r,c:iN})}`,from:'file'};
        const k=BOOK.findIndex(b=>b.from==='file'&&((rec.id&&b.id===rec.id)||(!rec.id&&nName(b.name)===nName(rec.name)&&nBiz(b.biz)===nBiz(rec.biz)&&b.birth===rec.birth)));
        if(k>=0){BOOK[k]=rec;updated++}else{BOOK.push(rec);added++}}
    }
    saveBook();if(bizN)saveBiz();S.bookMsg=seen||!bizN?`연락처 ${seen}명 읽음 (새로 ${added} · 갱신 ${updated})${bizN?` · 사업장 ${bizN}곳`:''}`:`사업장목록 ${bizN}곳 읽음`;
    S.emps.forEach(e=>{const c=S.contacts[e.r];if(!c||(!c.email&&!c.phone)||c.auto)delete S.contacts[e.r]});
    applyBook();render();if(REQ){REQ.to=REQ.kind==='emp'&&REQ.to?REQ.to:null;reqShow()}
  }catch(err){S.bookMsg='연락처 파일을 읽지 못했습니다: '+err.message;render()}
}
/* 현재 급여대장의 사업장 문맥(제목 줄 + 파일명) */
function bizContext(){return nBiz((S.raw||[]).slice(0,8).flat().filter(v=>typeof v==='string').join(' ')+' '+S.file+' '+S.company+' '+S.sheetName)}
/* 직원 1명 ↔ 주소록 매칭: {status:auto|check|multi|none, rec, cands, why} */
function matchContact(e){
  if(!BOOK.length)return {status:'none',why:'주소록이 비어 있음'};
  const ctx=bizContext(),inBiz=b=>{const k=nBiz(b.biz);if(!k)return false;if(ctx.includes(k))return true;const t=nBiz(String(b.biz).split(/\s+/)[0]);return t.length>=2&&ctx.includes(t)};
  const bizBook=BOOK.filter(inBiz),pool=bizBook.length?bizBook:BOOK,scope=bizBook.length?'같은 사업장':'전체 주소록(사업장 미확인)';
  const nm=nName(e.name),eb=e.birth||'';
  let c=pool.filter(b=>nName(b.name)===nm);
  const typed=c.filter(b=>b.from==='typed'&&(!eb||!b.birth||b.birth===eb));
  if(typed.length===1&&c.length>1)return {status:'auto',rec:typed[0],why:'예전에 직접 입력한 연락처'};
  const spaced=c.length&&c.every(b=>b.name.replace(/\s+/g,'')!==b.name)?' (띄어쓰기만 다름)':'';
  if(c.length>1&&eb){const cb=c.filter(b=>b.birth&&b.birth===eb);if(cb.length===1)return {status:bizBook.length?'auto':'check',rec:cb[0],why:`${scope} · 이름·생년월일 일치${spaced}`}}
  if(c.length>1)return {status:'multi',cands:c,why:`${scope}에 같은 이름 ${c.length}명 — 생년월일로 구분 불가`};
  if(c.length===1){const b=c[0];
    if(eb&&b.birth&&b.birth!==eb)return {status:'check',rec:b,why:`${scope} · 이름은 같지만 생년월일이 다름 (급여대장 ${eb} / 연락처 ${b.birth})`};
    if(!bizBook.length)return {status:'check',rec:b,why:`${scope} · 이름만 일치. 사업장을 확인하세요`};
    return {status:'auto',rec:b,why:`${scope} · 이름${eb&&b.birth?'·생년월일':''} 일치${spaced}`}}
  const near=pool.filter(b=>{const x=nName(b.name);return x.length>=2&&lev(x,nm)===1});
  if(near.length===1)return {status:'check',rec:near[0],why:`${scope} · 이름이 한 글자 다름 (${near[0].name}) — 오타인지 확인`};
  if(near.length>1)return {status:'multi',cands:near,why:`${scope}에 비슷한 이름 ${near.length}명`};
  return {status:'none',why:`${scope}에 없음`};
}
/* 자동 일치(auto)만 채우고, 확인 필요(check)는 제안만 한다 */
function applyBook(){
  S.match={};
  S.emps.forEach(e=>{const m=matchContact(e);S.match[e.r]=m;
    const cur=S.contacts[e.r];
    if(cur&&(cur.email||cur.phone))return;
    if(m.status==='auto'){S.contacts[e.r]={email:m.rec.email,phone:m.rec.phone,auto:true,src:m.rec.src,kakao:m.rec.kakao};
      if(S.chan[e.r]===undefined)S.chan[e.r]=(m.rec.kakao&&m.rec.phone)?'알림톡':'이메일'}
  });
  S.emps.forEach(e=>{if(!S.contacts[e.r])S.contacts[e.r]={email:'',phone:''}});
}
function useMatch(r,i){const m=S.match[r];const rec=m.rec||(m.cands||[])[i];if(!rec)return;
  S.contacts[r]={email:rec.email,phone:rec.phone,auto:true,src:rec.src+' (담당자 확인)',kakao:rec.kakao};
  S.match[r]={status:'auto',rec,why:'담당자가 확인해 연결함'};if(S.chan[r]===undefined)S.chan[r]=(rec.kakao&&rec.phone)?'알림톡':'이메일';render()}
/* 직접 입력한 연락처를 주소록에 기억 */
function rememberTyped(e){const c=S.contacts[e.r];if(!c||(!c.email&&!c.phone))return;
  const biz=S.company||S.vendor||'';const k=BOOK.findIndex(b=>b.from==='typed'&&nName(b.name)===nName(e.name)&&nBiz(b.biz)===nBiz(biz)&&(b.birth||'')===(e.birth||''));
  const rec={biz,name:e.name,birth:e.birth||'',phone:nPhone(c.phone),email:c.email.trim(),kakao:null,src:'직접 입력 '+new Date().toLocaleDateString('ko-KR'),from:'typed'};
  if(k>=0)BOOK[k]=rec;else BOOK.push(rec);saveBook()}

async function doSend(){

    const ch=chLabel(chOf(e.r)),c=S.contacts[e.r],t=new Date().toLocaleTimeString('ko-KR',{hour12:false});
    if(needPick()){S.send[e.r]={s:'보류',m:'표 선택 미확정 → 2단계에서 표를 확정하세요'};S.logs.push(`${t}  ${e.name}  보류 — 표 선택 미확정`);render();continue}

    const why=chOk(e),ok=!why;

}

function mailHref(to,txt,subject){const body=txt.length>1800?txt.slice(0,1800)+'\n…(길어서 줄임. 전체는 첨부한 요청서·수정 이력 파일 참고)':txt;
  return `mailto:${encodeURIComponent(to||'')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`}
/* 웹메일: Gmail·Outlook.com은 받는 사람·제목·본문을 채운 쓰기 화면을 열 수 있음(로그인 안 돼 있으면 로그인 화면을 거침).
   네이버·네이트·다음은 쓰기 화면을 미리 채우는 공식 주소를 확인하지 못해 메일 화면을 열고 문구를 클립보드에 복사해 둠 */

 {k:'gmail',name:'Gmail',fill:true,url:(to,su,body)=>`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(to||'')}&su=${encodeURIComponent(su)}&body=${encodeURIComponent(body)}`},
 {k:'naver',name:'네이버 메일',fill:false,url:()=>'https://mail.naver.com/'},
 {k:'nate',name:'네이트 메일',fill:false,url:()=>'https://mail.nate.com/'},
 {k:'daum',name:'다음 메일',fill:false,url:()=>'https://mail.daum.net/'},
 {k:'outlook',name:'Outlook.com',fill:true,url:(to,su,body)=>`https://outlook.live.com/mail/0/deeplink/compose?to=${encodeURIComponent(to||'')}&subject=${encodeURIComponent(su)}&body=${encodeURIComponent(body)}`}];
const shortBody=txt=>txt.length>1800?txt.slice(0,1800)+'\n…(길어서 줄임. 전체는 첨부한 요청서·수정 이력 파일 참고)':txt;
function webHref(w,to,txt,su){return w.url(to,su,shortBody(txt))}
function refreshMail(){document.querySelectorAll('a[data-web]').forEach(a=>{const w=WEBMAIL.find(x=>x.k===a.dataset.web),o=officeText(),txt=S.officeDraft!=null?S.officeDraft:o.text,to=($('[data-office-to]')||{value:''}).value.trim();a.href=webHref(w,to,txt,o.subject)});const a=$('#mailbtn');if(!a)return;const o=officeText(),txt=S.officeDraft!=null?S.officeDraft:o.text,to=($('[data-office-to]')||{value:''}).value.trim();a.href=mailHref(to,txt,o.subject)}
async function officeAct(k,btn){const o=officeText(),txt=S.officeDraft!=null?S.officeDraft:o.text,{amt,open}=officeItems(),to=($('[data-office-to]')||{value:''}).value.trim();

  }catch(e){S.officeMsg=(k==='copy'?'복사할 수 없습니다. 상자 안 문구를 직접 선택해 복사하세요.':'저장할 수 없습니다')+(e&&e.code==='declined'?' (취소함)':'');render()}}

/* ============ [v12] 확인 요청: 오류 바로 아래 버튼 → 요청 창 ============
   받는 곳 두 갈래: 세무/노무사무소(금액·계산) / 직원 본인(근무시간·입사일·본인 확인 같은 본인 정보).
   사무소는 자버 사업장목록(급여대장 작성·작성 사무소 열) → 대장에 적힌 작성처 순으로 찾고, 메일 주소는 사무소별로 이 브라우저에 기억.
   실제 발송은 하지 않음: 메일 쓰기 화면·초안만 열고, 보내기는 담당자가 직접 */
const BIZ_KEY='payslip_biz_v1';let BIZ=[];try{BIZ=JSON.parse(localStorage.getItem(BIZ_KEY)||'[]')||[]}catch(_){BIZ=[]}
function saveBiz(){try{localStorage.setItem(BIZ_KEY,JSON.stringify(BIZ))}catch(_){}}
function readBizSheet(a,src){const hr=a.findIndex(r=>r.some(v=>norm(v)===norm('급여대장 작성 사무소')));if(hr<0)return 0;
  const H=a[hr].map(norm),ix=k=>H.findIndex(x=>k.map(norm).includes(x));
  const iB=ix(['상호','사업장명']),iC=ix(['사업장코드']),iW=ix(['급여대장 작성']),iO=ix(['급여대장 작성 사무소']);if(iB<0)return 0;let n=0;
  for(let r=hr+1;r<a.length;r++){const row=a[r]||[],biz=String(row[iB]??'').trim();if(!biz)continue;
    const rec={biz,code:iC>=0?String(row[iC]??'').trim():'',who:iW>=0?String(row[iW]??'').trim():'',office:iO>=0?String(row[iO]??'').trim():'',src:src+'!'+XLSX.utils.encode_cell({r,c:iB})};
    const k=BIZ.findIndex(b=>(rec.code&&b.code===rec.code)||nBiz(b.biz)===nBiz(rec.biz));if(k>=0)BIZ[k]=rec;else BIZ.push(rec);n++}
  return n}
function bizOf(){if(!BIZ.length||!S||!S.raw)return null;const ctx=bizContext();
  const m=BIZ.filter(b=>{const k=nBiz(b.biz);if(k&&ctx.includes(k))return true;const t=nBiz(String(b.biz).split(/\s+/)[0]);return t.length>=2&&ctx.includes(t)});
  return m.length===1?m[0]:null}
const OFFICE_RE=/(세무|노무|회계)/;
function officeWho(){const b=bizOf(),fileV=OFFICE_RE.test(S.vendor||'')?S.vendor:'';
  if(b&&!b.office&&/사장|대표|직접|자체/.test(b.who))return {name:'',kind:'내부',biz:b,fileV,label:'내부 담당자·결재자 (급여대장을 사업장에서 직접 작성)',diff:false};
  const name=(b&&b.office)||fileV,core=x=>nBiz(x).replace(/세무회계|세무사무소|세무법인|노무법인|노무사무소|회계법인|회계사무소/g,'');
  const diff=!!(b&&b.office&&fileV&&!core(fileV).includes(core(b.office))&&!core(b.office).includes(core(fileV)));
  return {name,kind:b&&b.who?b.who:(/노무/.test(name)?'노무사':name?'세무사':''),biz:b,fileV,label:name||'작성 사무소(찾지 못함)',diff}}
const EMP_ASK=new Set(['CALC_MISMATCH','MISSING_VALUE','DUPLICATE_EMP','DUP_ID','AFTER_TOTAL','SHEET_NAME']);
function reqBtns(i){const e=i.sel&&i.sel.r!==undefined&&S.emps.find(x=>x.r===i.sel.r),o=officeWho();
  return `<div class="reqbtns" style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0"><button class="btn sm" data-act="req" data-to="office" data-key="${esc(i.key)}" data-ty="${i.type}">${o.kind==='내부'?'내부 담당자에게 확인 요청':'세무/노무사무소에 확인 요청'}</button>${e?`<button class="btn sm" data-act="req" data-to="emp" data-key="${esc(i.key)}" data-ty="${i.type}">직원에게 확인 요청</button>`:''}</div>`}
function officeOne(i){const g=guideOf(i),who=S.company||S.vendor||'거래처',mon=S.payMonth||'';
  const a=(g.ask||`[${who}] ${mon} 급여대장 확인 요청\n${i.msg}. 확인 부탁드립니다.`).split('\n');
  return {subject:a[0],text:`안녕하세요. ${mon?mon+' ':''}급여명세서를 만들면서 원본 급여대장(${S.file})에서 확인이 필요한 내용이 있어 문의드립니다.\n\n${a.slice(1).join('\n')}\n\n${WHO||'담당자'} 드림`}}
function empAsk(i,e){const c=i.ctx||{},mon=S.payMonth||'이번 달',co=S.company||'회사';let q;
  switch(i.type){
   case 'CALC_MISMATCH':q=`${mon} 급여 자료에 ${e.name}님의 근로시간이 ${c.h.v}시간, 시급이 ${won(c.rt.v)}원으로 되어 있습니다. 실제 근무한 시간이 맞는지 확인 부탁드립니다. 다르면 실제 근무시간을 알려 주세요.`;break;
   case 'DUPLICATE_EMP':case 'DUP_ID':q='급여 자료에 같은 이름(또는 같은 사번)이 두 번 있어 본인 확인이 필요합니다. 생년월일 앞 6자리와 사번을 알려 주세요.';break;
   case 'AFTER_TOTAL':q=`${mon} 급여 대상인지 확인하려고 합니다. 근무를 시작한 날(입사일)을 알려 주세요.`;break;
   case 'SHEET_NAME':q='급여 자료에 적힌 이름 표기가 서로 달라 확인하려고 합니다. 성명을 정확히 알려 주세요.';break;
   case 'MISSING_VALUE':q=`${mon} 급여 자료에서 ${e.name}님 정보 일부가 비어 있습니다(${i.msg}). 해당 내용을 알려 주시거나 맞는지 확인 부탁드립니다.`;break;
   default:q=`${mon} 급여명세서를 준비하면서 ${e.name}님 급여 항목(${ISSUE_TYPE[i.type]||'금액'})을 세무/노무사무소와 확인하고 있습니다. 이번 달에 근무시간·수당·공제 등 바뀐 점이 있었다면 알려 주세요.`}
  return `${e.name}님, 안녕하세요.\n${co} 급여 담당 ${WHO||'담당자'}입니다.\n\n${q}\n\n회신하실 때 주민등록번호 전체나 계좌 비밀번호는 적지 말아 주세요.\n감사합니다.`}

  else if(t.id==='file'&&t.files.length>1)loadFiles([...t.files]);
  else if(t.id==='addfile'&&t.files.length)loadFiles([...t.files],true);
  else if(t.id==='file'&&t.files[0])loadFile(t.files[0]);
  else if((t.id==='bookfile'||t.hasAttribute('data-bookfile'))&&t.files[0])loadBookFile(t.files[0]);
});

});

/* ================= 명세똑똑 합본: 유경 판에서 옮겨 온 기능 =================
   1) 신뢰도 0%에서 시작 · 승인 누적(승인 ÷ (승인+수정+1)) + 거래처(사업장)별 학습 — 공유 DB
   2) 오류 고치기 제안 버튼 (누르면 수정 이력에 남음)
   3) 장기요양보험(건보 × 13.14%) · 강사료 3.3% · 원천징수 누락 · 금액까지 같은 중복 행은 오류
   4) 전월 비교(같이 올린 지난달 파일 또는 저장본) · 전월 급여 저장(이름 가림, 사업장별 직전 1개월)
   5) 공통 형식 JSON 저장 */
let DBC=null,DBMODE='local',RULES={};
const LSK='msdd-db-v1';
const lsAll=()=>{try{return JSON.parse(localStorage.getItem(LSK)||'{}')}catch(_){return {}}};
const lsSave=o=>{try{localStorage.setItem(LSK,JSON.stringify(o))}catch(_){}};
const hash=s=>{let h=5381;for(const ch of String(s))h=((h<<5)+h+ch.codePointAt(0))>>>0;return h.toString(36)};
const store={
  async list(col){if(DBC){try{const s=await DBC.collection(col).get();return s.docs.map(d=>({_id:d.id,...(d.data()||{})}))}catch(_){}}
    return Object.entries(lsAll()[col]||{}).map(([k,v])=>({_id:k,...v}))},
  async set(col,id,data){if(DBC){try{await DBC.doc(col+'/'+id).set(data);return 'shared'}catch(_){}}
    const a=lsAll();(a[col]=a[col]||{})[id]=data;lsSave(a);return 'local'},
  async del(col,id){if(DBC){try{await DBC.doc(col+'/'+id).delete()}catch(_){}}const a=lsAll();if(a[col])delete a[col][id];lsSave(a)}
};
const normCo=s=>String(s||'').replace(/\s|\(주\)|㈜|주식회사/g,'');
/* 사업장 이름이 원본에 "회사명:" 형식으로 없으면 첫 줄 제목에서 추정("벼리솔학원 목동 2026년 11월 급여대장") */
function coFallback(){if(S.company)return;
  const rows=(S.slipSheets?S.sheets[S.slipSheets[0]]:S.sheets[S.sheetName])||[];
  for(const row of rows.slice(0,4)){const first=rowStr(row);if(!first)continue;
    const t=first.match(/^([가-힣A-Za-z0-9]+(?:\s(?!\d)(?!급여|임금)[가-힣A-Za-z0-9]+)?)\s*(?:20\d\d|\d{1,2}월|급여|임금|\()/);
    if(t&&!/^(급여|임금|성명|이름|no|번호)/i.test(t[1])){S.company=t[1];S.coGuess=true}return}}
const vname=()=>normCo(S.company)||normCo(S.vendor)||'미확인';
const lkey=l=>'l'+hash(norm(String(l||'')));
const ruleId=c=>'v'+hash(vname())+'_'+lkey(c.label);
async function loadRules(){RULES={};try{(await store.list('rules')).forEach(r=>{RULES[r._id]=r})}catch(_){}
  /* 시연용 승인 기록(이 브라우저에만): 공유 기록이 없을 때만 씀 */
  try{const d=JSON.parse(localStorage.getItem('msdd-demo-rules')||'{}');Object.entries(d).forEach(([k,v])=>{if(!RULES[k])RULES[k]=v})}catch(_){}}
const ruleOf=c=>RULES[ruleId(c)]||null;
const isHuman=c=>!!S.approved[c.c]||S.colOverride[c.c]!==undefined;
const isCorrected=c=>S.colOverride[c.c]!==undefined&&(S.colOverride[c.c]||'')!==(c.code||'');
function trustCount(c){const code=effCode(c)||'',r=ruleOf(c);let a=0,k=0;
  if(r){k=r.corrections||0;if((r.code||'')===code)a=r.approvals||0}
  if(!S.counted[c.c]){if(isHuman(c))a+=1;if(isCorrected(c))k+=1}
  return {a,k}}
const needsCheck=c=>!isHuman(c)&&trustCount(c).a===0&&(c.conf||0)<.9;
function applyLearned(){S.learnedN=0;
  S.cols.forEach(c=>{if(c.role)return;if(c.code0===undefined){c.code0=c.code;c.conf0=c.conf;c.why0=c.why;c.skip0=c.skip}
    else{c.code=c.code0;c.conf=c.conf0;c.why=c.why0;c.skip=c.skip0}
    const r=RULES[ruleId(c)];if(!r)return;const a=r.approvals||0,k=r.corrections||0;
    c.code=r.code||null;if(r.code)c.skip=false;if(a>0)c.conf=Math.max(c.conf||0,.97);
    c.why=`학습(${S.company||S.vendor}): 승인 ${a}회·수정 ${k}회`;S.learnedN++})}
/* 사람이 승인하거나 고친 매핑을 바로 규칙으로 저장(한 파일에서 열마다 한 번만 센다) */
async function commitRule(c){if(!c||S.counted[c.c]||!isHuman(c))return;
  const id=ruleId(c),{a,k}=trustCount(c),rule={vendorName:S.company||S.vendor||'',label:c.label,code:effCode(c)||'',approvals:a,corrections:k,lastAt:Date.now()};
  S.counted[c.c]=true;RULES[id]=rule;try{await store.set('rules',id,rule)}catch(_){}}
function approveCol(cc,quiet){const c=S.cols.find(x=>x.c===+cc);if(!c||S.approved[c.c])return;S.approved[c.c]=true;
  if(!quiet)logEdit({kind:'매핑 승인',target:`열 “${c.label}” → ${effCode(c)?STD[effCode(c)].label:'(사용 안 함)'}`,cell:'',reason:'담당자 승인'});commitRule(c)}

/* ---------- 추가 검증 ---------- */
const lectureLike=it=>it&&it.raw&&it.raw.some(l=>/강사료|강의료|수업료|강사수당/.test(l));
const J=(w,a,b)=>{w=String(w);const c=w.charCodeAt(w.length-1);return w+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?a:b)};
const JRO=w=>{w=String(w);const c=w.charCodeAt(w.length-1),k=(c>=0xAC00&&c<=0xD7A3)?(c-0xAC00)%28:0;return w+(k&&k!==8?'으로':'로')};
const PREV_CODES=['EARN_BASE','EARN_POSITION','EARN_MEAL','DED_NPS','DED_NHI','DED_LTC','DED_EI'];
const isHourly=e=>!!bv(e,'rate');
function prevEmp(e){const P0=S.prev;if(!P0||!P0.emps||e.blank)return null;
  const pool=P0.emps.filter(x=>!x.blank);
  if(e.id){const byId=pool.find(x=>x.id&&x.id===e.id);if(byId)return byId}
  if(P0.stored){const k=maskName(e.name),c=pool.filter(x=>x.name===k);return c.length===1?c[0]:null}
  return pool.find(x=>x.name===e.name)||null}
function extraIssues(out){
  const P=(key,level,type,msg,sel,hint)=>out.push({key,level,type,msg,sel,hint});
  const same=(a,b)=>{const ks=new Set([...Object.keys(a.items),...Object.keys(b.items)]);for(const k of ks)if(((a.items[k]||{}).amount||0)!==((b.items[k]||{}).amount||0))return false;return true};
  out.forEach(i=>{if(i.type!=='DUPLICATE_EMP'||i.level!=='warn')return;const e=S.emps.find(x=>x.r===i.sel.r);if(!e)return;
    const o=S.emps.find(x=>x!==e&&x.name===e.name&&x.r<e.r);if(o&&same(e,o)){i.level='error';i.exact=true;
      i.msg=`중복 ${S.transposed?'열':'행'}: ${e.name} — 금액까지 같은 ${S.transposed?'열':'행'}이 한 번 더 있습니다`;
      i.hint=`${o.name}님 ${S.transposed?'열':'행'}과 모든 금액이 같습니다. 복사하다 한 번 더 들어간 것으로 보입니다. 한쪽을 발송에서 빼세요.`}});
  S.emps.forEach(e=>{if(e.blank)return;
    const A=c=>e.items[c]?e.items[c].amount:0,nhi=A('DED_NHI'),ltc=A('DED_LTC');
    if(nhi>0&&ltc>0){const exp=nhi*RATES.ltc;if(Math.abs(ltc-exp)>Math.max(100,exp*.05))
      P(`ltc|${e.r}`,'info','RATE_ANOMALY',`${e.name}: 장기요양보험 ${won(ltc)}원 — 건강보험료 ${won(nhi)}원 × ${(RATES.ltc*100).toFixed(2)}% ≈ ${won(Math.floor(exp/10)*10)}원`,{t:'item',r:e.r,code:'DED_LTC'},'장기요양보험료는 건강보험료에 장기요양 보험료율을 곱해 계산합니다(요율 확인 필요). 건강보험료가 틀려도 이 표시가 같이 뜹니다.')}
    const L=e.items.EARN_BASE;
    if(lectureLike(L)&&!Object.keys(e.items).some(k=>STD[k].kind==='earn'&&k!=='EARN_BASE'&&A(k)>0)&&L.amount>0){
      const it=A('DED_INCOME_TAX'),ex=Math.floor(L.amount*.03/10)*10;
      if(!it&&!A('DED_LOCAL_TAX'))P(`biz|${e.r}`,'warn','BIZ_TAX',`${e.name}: 강사료 ${won(L.amount)}원에 원천징수(3.3%)가 없습니다`,{t:'item',r:e.r,code:'EARN_BASE'},'강사료가 사업소득이면 소득세 3% + 지방소득세 0.3%를 떼야 합니다(소득세법 제129조 ①3). 근로소득으로 주는 경우라면 정상 처리하세요(확인 필요).');
      else if(it&&Math.abs(it-L.amount*.03)>10&&e.items.DED_NPS===undefined)P(`biz|${e.r}`,'warn','BIZ_TAX',`${e.name}: 소득세 ${won(it)}원 — 강사료 사업소득 3.3% 중 소득세 3%는 ${won(ex)}원`,{t:'item',r:e.r,code:'DED_INCOME_TAX'},'4대보험 공제가 없는 강사료라 사업소득(3.3%)으로 보고 비교했습니다. 근로소득이면 정상 처리하세요(확인 필요).')}});
  if(S.prev&&S.prev.emps){const used=new Set();
    S.emps.forEach(e=>{if(e.blank)return;const pe=prevEmp(e);if(pe)used.add(pe);
      if(!pe&&S.prev.stored&&S.prev.emps.filter(x=>x.name===maskName(e.name)).length>1)return;
      if(!pe){P(`prevnew|${e.r}`,'info','PREV_CHANGE',`${e.name}: 전월 대장에 없는 직원 (신규 입사?)`,{t:'emp',r:e.r},'전월 대장에 같은 이름·사번이 없습니다. 신규 입사자인지, 이름 오타인지 확인하세요.');return}
      if(isHourly(e)||pe.hourly)return;
      PREV_CODES.forEach(code=>{const a=(e.items[code]||{}).amount||0,b=(pe.items[code]||{}).amount||0;if(a===b)return;
        if(!a&&b){const other=Object.keys(e.items).find(k=>k!==code&&!pe.items[k]&&e.items[k].amount===b&&e.items[k].cols&&e.items[k].cols.length);
          if(other){const col=S.cols.find(x=>x.c===e.items[other].cols[0]);
            P(`prevmap|${e.r}|${code}`,'warn','PREV_CHANGE',`${e.name}: 전월 ${STD[code].label} ${won(b)}원이 이번 달엔 열 “${col.label}”(${STD[other].label})에 들어 있습니다`,{t:'col',c:col.c},`전월 ${J(STD[code].label,'이었','였')}던 금액이 이번 달 열 “${col.label}”에 같은 금액으로 있습니다. 항목명이 바뀌어 매핑이 달라졌을 가능성이 큽니다.`);
            out[out.length-1].fix={kind:'map',col:col.c,to:code,label:`“${col.label}” 열을 ${STD[code].label} 항목으로 바꾸기`,note:'지난달에는 이 금액이 '+STD[code].label+' 항목이었습니다. 전 직원에게 적용됩니다.'};return}}
        const big=code==='EARN_BASE'||code==='EARN_POSITION';
        P(`prev|${e.r}|${code}`,big?'warn':'info','PREV_CHANGE',`${e.name}: ${STD[code].label} 전월 ${won(b)}원 → 이번 달 ${won(a)}원 (${a-b>0?'+':''}${won(a-b)}원)`,{t:'item',r:e.r,code},
          big?'매달 같은 금액이 보통인 항목입니다. 인상·변경이 있었다면 정상 처리, 오타라면 전월 값으로 고치세요.':'보수월액·요율 변경이 있으면 달라질 수 있습니다. 기본급이 그대로인데 보험료만 바뀌었다면 확인하세요.')})});
    const gone=S.prev.emps.filter(x=>!x.blank&&!used.has(x)).map(x=>x.name);
    if(gone.length)P('prevgone','info','PREV_CHANGE',`전월에 있던 ${gone.join(', ')}이(가) 이번 달 대장에 없습니다`,{t:'file'},'퇴사·휴직이 아니라면 행이 빠졌는지 원본을 확인하세요.')}
  out.forEach(i=>{if(!i.fix)i.fix=fixFor(i,out)});
  return out}

/* ---------- 고치기 제안 ---------- */
function typoLike(a,b){if(!a||!b||a===b)return false;const r=a/b;if([10,100,.1,.01].some(x=>Math.abs(r-x)<1e-9))return true;
  const sa=String(Math.abs(a)),sb=String(Math.abs(b));if(sa.length!==sb.length)return false;
  const d=[...sa].reduce((n,c,i)=>n+(c!==sb[i]),0);return d===1||(d===2&&[...sa].sort().join('')===[...sb].sort().join(''))}
function fixFor(i,all){
  const e=i.sel&&i.sel.r!==undefined?S.emps.find(x=>x.r===i.sel.r):null,A=c=>e&&e.items[c]?e.items[c].amount:0;
  if(i.type==='LOW_CONFIDENCE'&&i.sel.t==='col'){const c=S.cols.find(x=>x.c===i.sel.c);return c&&effCode(c)?{kind:'approve',col:c.c,label:`맞아요, “${c.label}” 열은 ${STD[effCode(c)].label}입니다`,note:'원본을 보고 맞으면 누르세요. 틀리면 아래에서 표준 항목을 바꾸세요.'}:null}
  if(i.type==='DUPLICATE_EMP'&&i.exact&&e)return {kind:'exclude',r:e.r,label:`똑같은 ${S.transposed?'열':'줄'}이니 하나는 보내지 않기`,note:'이 직원에게 명세서가 두 번 가지 않도록 이 '+(S.transposed?'열':'줄')+'만 발송 대상에서 뺍니다.'};
  if(i.type==='PREV_CHANGE'&&i.sel.t==='item'&&e){const pe=prevEmp(e),b=pe&&pe.items[i.sel.code]?pe.items[i.sel.code].amount:0;
    return {kind:'amt',edits:[[i.sel.code,b]],label:`${J(STD[i.sel.code].label,'을','를')} 지난달과 같은 ${won(b)}원으로 바꾸기`,note:'이번 달 금액이 잘못 적힌 경우에 누르세요. 실제로 바뀐 금액이면 아래 안내 카드에서 확인 처리하세요.'}}
  if(i.type==='LOCAL_TAX'&&e&&i.ctx&&(all||S.issues).some(o=>o.type==='BIZ_TAX'&&o.sel.r===e.r)){const L=A('EARN_BASE'),it=Math.floor(L*.03/10)*10,lt=Math.floor(it/100)*10;
    return {kind:'amt',edits:[['DED_INCOME_TAX',it],['DED_LOCAL_TAX',lt]],label:`강사료 세금을 3.3%로 맞추기`,note:`강사료 세금(3.3%)도 틀린 직원이라 소득세 쪽을 고칩니다. 바꾸면 소득세 ${won(it)}원, 지방소득세 ${won(lt)}원입니다.`}}
  if(i.type==='LOCAL_TAX'&&e&&i.ctx){const {tx,lc,sw}=i.ctx;
    if(sw)return {kind:'amt',edits:[['DED_INCOME_TAX',lc],['DED_LOCAL_TAX',tx]],label:`소득세와 지방소득세 금액을 서로 맞바꾸기`,note:`두 칸이 뒤바뀌어 적힌 경우입니다. 바꾸면 소득세 ${won(lc)}원, 지방소득세 ${won(tx)}원이 됩니다.`};
    if(tx>0){const v=Math.floor(tx/100)*10;return {kind:'amt',edits:[['DED_LOCAL_TAX',v]],label:`지방소득세를 ${won(v)}원으로 바꾸기`,note:'지방소득세는 소득세의 10%입니다.'}}}
  if(i.type==='RATE_ANOMALY'&&e&&i.key.startsWith('ltc|')){const v=Math.floor(A('DED_NHI')*RATES.ltc/10)*10;return {kind:'amt',edits:[['DED_LTC',v]],label:`장기요양보험을 ${won(v)}원으로 바꾸기`,note:`건강보험료 × ${(RATES.ltc*100).toFixed(2)}%로 계산한 금액입니다(요율 확인 필요). 건강보험료가 틀렸다면 그쪽을 먼저 확인하세요.`}}
  if(i.type==='BIZ_TAX'&&e){const L=A('EARN_BASE'),it=Math.floor(L*.03/10)*10,lt=Math.floor(it/100)*10;
    return {kind:'amt',edits:[['DED_INCOME_TAX',it],['DED_LOCAL_TAX',lt]],label:`강사료 세금을 3.3%로 맞추기`,note:`강사료는 보통 3.3%(소득세 3% + 지방소득세 0.3%)를 뗍니다(확인 필요). 바꾸면 소득세 ${won(it)}원, 지방소득세 ${won(lt)}원입니다.`}}

  m.innerHTML=`<div class="mbox pbox" role="dialog" aria-modal="true" aria-labelledby="pktitle"><h3 id="pktitle" style="margin:0 0 4px">누구의 인적사항이 바뀌었나요?</h3>
   <p class="muted" style="font-size:12.5px;margin:0 0 10px">이미 보낸 ${L.length}명 중에서 고르세요.</p>
   <div class="pick">${L.map(e=>`<button class="pickrow" data-act="mpinfo" data-r="${e.r}"><b>${esc(e.name)}</b><span class="muted">${esc(e.dept||'')}${e.birth?' · '+esc(fmtB(e.birth)):''}</span><span class="muted">${esc((S.contacts[e.r]||{}).email||(S.contacts[e.r]||{}).phone||'')}</span></button>`).join('')}</div>
   <div class="mbtns"><button class="btn" data-act="pfcancel">취소</button></div></div>`;m.hidden=false;m.querySelector('.pickrow').focus()}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-act="mpick"]');if(t)pinfoPick()});

document.addEventListener('dragover',ev=>{const d=$('#drop');if(d){ev.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',ev=>{const d=$('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',ev=>{const d=$('#drop');if(!d)return;ev.preventDefault();d.classList.remove('over');const fs=[...ev.dataTransfer.files];if(fs.length>1)loadFiles(fs);else if(fs[0])loadFile(fs[0])});
render();
if(window.claude&&claude.use){
  claude.use('sample').then(f=>{if(f){SAMPLE=f;render()}},()=>{});
  claude.use('downloads').then(f=>{if(f){DL=f;render()}},()=>{});
  claude.use('db').then(d=>{if(d){DBC=d;DBMODE='shared'}return loadRules()},()=>loadRules()).then(()=>render(),()=>{});
}else loadRules().then(()=>render(),()=>{}); /* claude.ai 밖(Vercel 등): 이 브라우저 저장소의 승인 기록을 읽음 */
</script>

</body></html>
